<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Locket Clone</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#fff8f5">
</head>
<body>

  <div class="main-app">

    <div class="header">
      <div class="header-brand">
        <span class="header-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </span>
        <h1>Locket</h1>
      </div>
      <div class="url-box"></div>
    </div>

    <div class="action-bar">
      <button id="openCameraBtn" class="btn-camera hide-camera">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Mở Camera
      </button>
      <button id="uploadImageBtn" class="btn-upload">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2.5"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Upload ảnh
      </button>
    </div>

    <div class="gallery">
      <div class="gallery-header">
        <h3>Khoảnh khắc</h3>
        <span class="photo-count" id="photoCount"></span>
      </div>
      <div id="imageGrid" class="image-grid">
        <div class="loading">Đang tải...</div>
      </div>
    </div>

  </div>

  <!-- Camera popup -->
  <div id="cameraScreen" class="camera-screen hidden">
    <div class="camera-top-bar">
      <button id="closeCamera" class="close-cam" aria-label="Đóng">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <span class="cam-title">Chụp ảnh</span>
      <button id="switchCamera" class="switch-cam" aria-label="Đổi camera">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </div>

    <div class="camera-preview-area">
      <video id="cameraPreview" autoplay playsinline muted></video>
    </div>

    <div class="camera-bottom-bar">
      <button id="takePhotoBtn" class="take-photo-btn" aria-label="Chụp">
        <div class="inner-circle"></div>
      </button>
    </div>
  </div>

  <input type="file" id="fileUpload" accept="image/*" style="display:none">
  <canvas id="hiddenCanvas" style="display:none"></canvas>

  <!-- Modal chỉnh sửa ảnh trước khi gửi -->
  <div id="editModal" class="edit-modal hidden">
    <div class="edit-modal-content">
      <div class="edit-modal-header">
        <h3>Gửi đến...</h3>
        <button id="closeEditModal" class="close-edit-modal">✕</button>
      </div>

      <!-- Ảnh preview -->
      <div class="edit-image-preview">
        <img id="previewImage" alt="Preview">
      </div>

      <!-- Comment input -->
      <div class="comment-section">
        <input type="text" id="commentInput" class="comment-input" placeholder="Viết chú thích...">
      </div>

      <!-- Rating stars -->
      <div class="rating-section">
        <div class="stars-container">
          <div class="stars" id="starRating">
            <span data-value="1">☆</span>
            <span data-value="2">☆</span>
            <span data-value="3">☆</span>
            <span data-value="4">☆</span>
            <span data-value="5">☆</span>
          </div>
        </div>
      </div>

      <div class="edit-modal-actions">
        <button id="cancelEditBtn" class="cancel-edit-btn">Hủy</button>
        <button id="confirmSendBtn" class="confirm-send-btn">Gửi ✨</button>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
