<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Locket Clone</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <!-- Màn hình chính -->
  <div class="main-app">
    <div class="header">
      <h1>📸 Locket Clone</h1>
      <div class="url-box">
        <span id="urlText">Đang tải...</span>
        <button id="copyBtn">📋 Copy link</button>
      </div>
    </div>

    <div class="action-bar">
      <button id="openCameraBtn" class="btn-camera">📷 Mở Camera</button>
      <button id="uploadImageBtn" class="btn-upload">🖼️ Upload ảnh</button>
    </div>

    <div class="gallery">
      <h3>📸 Ảnh đã chia sẻ</h3>
      <div id="imageGrid" class="image-grid">
        <div class="loading">Đang tải...</div>
      </div>
    </div>
  </div>

  <!-- MÀN HÌNH CAMERA (POPUP) -->
  <div id="cameraScreen" class="camera-screen hidden">
    <div class="camera-top-bar">
      <button id="closeCamera" class="close-cam">✕</button>
      <button id="switchCamera" class="switch-cam">🔄</button>
    </div>
    
    <div class="camera-preview-area">
      <video id="cameraPreview" autoplay playsinline></video>
    </div>
    
    <div class="camera-bottom-bar">
      <button id="takePhotoBtn" class="take-photo-btn">
        <div class="inner-circle"></div>
      </button>
    </div>
  </div>

  <input type="file" id="fileUpload" accept="image/*" style="display: none;">
  <canvas id="hiddenCanvas" style="display: none;"></canvas>

  <script type="module" src="/main.js"></script>
</body>
</html>
