<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Locket Clone - Chia sẻ ảnh ngay</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>📸 Locket Clone</h1>
      <p class="subtitle">Chia sẻ ảnh/video HD - Mọi người cùng xem</p>
      <div class="share-url">
        <span id="urlDisplay">Đang tải...</span>
        <button id="copyUrlBtn" class="copy-btn">📋 Sao chép link</button>
      </div>
    </header>

    <main class="content">
      <div class="upload-section">
        <div class="action-buttons">
          <button id="cameraBtn" class="action-btn camera-btn">📷 Chụp ảnh</button>
          <button id="uploadBtn" class="action-btn upload-btn">🖼️ Upload ảnh/video</button>
        </div>
        
        <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
        
        <div id="cameraPreview" class="camera-preview hidden">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas" style="display: none;"></canvas>
          <div class="camera-controls">
            <button id="captureBtn" class="capture-btn">📸 Chụp</button>
            <button id="closeCameraBtn" class="close-btn">❌ Đóng</button>
          </div>
        </div>

      </div>

      <div class="gallery-section">
        <h2>📱 Ảnh & Video từ mọi người</h2>
        <div id="gallery" class="gallery-grid">
          <div class="loading">⏳ Đang tải...</div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
