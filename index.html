<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Locket Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#fff7f4">
</head>
<body>

  <!-- ── Màn hình chính ── -->
  <div class="main-app">

    <div class="header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <h1>Locket</h1>
        </div>
        <div class="url-box">
          <!-- URL content injected by main.js -->
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button id="openCameraBtn" class="btn-camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Mở Camera
      </button>
      <button id="uploadImageBtn" class="btn-upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2.5"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Upload ảnh
      </button>
    </div>

    <div class="gallery">
      <div class="gallery-header">
        <h3>Khoảnh khắc</h3>
        <span class="gallery-count" id="photoCount"></span>
      </div>
      <div id="imageGrid" class="image-grid">
        <div class="loading">
          <div class="loading-dots">
            <span></span><span></span><span></span>
          </div>
          <p>Đang tải…</p>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Màn hình Camera ── -->
  <div id="cameraScreen" class="camera-screen hidden">
    <div class="camera-top-bar">
      <button id="closeCamera" class="close-cam" aria-label="Đóng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <span class="cam-label">Chụp ảnh</span>
      <button id="switchCamera" class="switch-cam" aria-label="Đổi camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4v6h6"/>
          <path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </div>

    <div class="camera-preview-area">
      <video id="cameraPreview" autoplay playsinline muted></video>
      <div class="viewfinder">
        <span class="vf tl"></span>
        <span class="vf tr"></span>
        <span class="vf bl"></span>
        <span class="vf br"></span>
      </div>
    </div>

    <div class="camera-bottom-bar">
      <button id="takePhotoBtn" class="take-photo-btn" aria-label="Chụp">
        <div class="inner-circle"></div>
      </button>
    </div>
  </div>

  <input type="file" id="fileUpload" accept="image/*" style="display:none">
  <canvas id="hiddenCanvas" style="display:none"></canvas>

  <script type="module" src="/main.js"></script>
</body>
</html>
